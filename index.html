<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger — Money Planner</title>
<style>
  :root{
    --bg:#0A0A0C;
    --card:#151517;
    --card-2:#1D1D20;
    --card-3:#242428;
    --border:#26262B;
    --text:#F5F5F4;
    --dim:#9A9AA1;
    --faint:#5C5C63;
    --green:#34D399;
    --pink:#F87171;
    --amber:#FBBF24;
    --white:#FAFAFA;
    --ink:#0B0B0D;
    --r-card:20px;
    --r-pill:999px;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;}
  ::selection{background:var(--green);color:var(--ink);}
  button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:var(--sans);color:var(--text);}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:232px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;gap:20px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding:0 4px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(52,211,153,.6);}

  .stamp{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:16px;}
  .stamp-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6b6b70;font-weight:600;}
  .stamp-value{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;}
  .stamp-value.neg{color:#DC2626;}
  .stamp-sub{margin-top:4px;font-size:11px;color:#8a8a90;}

  .nav{display:flex;flex-direction:column;gap:4px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r-pill);color:var(--dim);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:background .12s,color .12s;text-align:left;width:100%;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--card-2);color:var(--text);}
  .nav-item.active{background:var(--card-3);color:var(--text);border-color:var(--border);}
  .nav-item.active svg{color:var(--green);opacity:1;}
  .side-foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:12px;}
  /* on desktop the drawer classes are inert */
  @media(min-width:861px){
    .sidebar.open{transform:none;}
    .drawer-backdrop.open{display:none;opacity:0;pointer-events:none;}
  }
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;display:inline-block;}
  .sync-dot.synced{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.5);}
  .sync-dot.syncing{background:var(--amber);}
  .sync-dot.error{background:var(--pink);}
  .sync-dot.ready{background:#60A5FA;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:28px 34px 80px;}

  .badge{display:inline-flex;gap:8px;align-items:center;padding:8px 15px;border:1px solid var(--border);border-radius:var(--r-pill);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:var(--card);}
  .badge.closed{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07);}

  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
  h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
  .subtitle{font-size:20px;color:var(--faint);font-weight:600;margin-top:2px;letter-spacing:-.01em;}

  .yearswitch{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);padding:4px;}
  .yearswitch button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim);}
  .yearswitch button:hover{background:var(--card-2);color:var(--text);}
  .yearswitch button svg{width:15px;height:15px;}
  .yearswitch .yr{font-family:var(--mono);font-weight:700;font-size:15px;padding:0 8px;min-width:62px;text-align:center;}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px;}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-pill);padding:12px 22px;font-weight:600;font-size:14px;}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--white);color:var(--ink);}
  .btn-primary:hover{background:#fff;}
  .btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--card-3);}
  .btn-small{padding:8px 16px;font-size:12.5px;}

  .grid{display:grid;gap:12px;}
  .grid>*{min-width:0;}
  .stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px;}
  .months-grid{grid-template-columns:repeat(4,minmax(0,1fr));}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px;}
  .card-label{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:12px;}
  .card-value{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;}
  .card-sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px;}
  .card.invert{background:var(--white);border-color:var(--white);color:var(--ink);}
  .card.invert .card-label{color:#6b6b70;}
  .card.invert .card-sub{color:#8a8a90;}
  .green{color:var(--green);}
  .pink{color:var(--pink);}
  .amber{color:var(--amber);}

  .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:30px 0 12px;}
  .section-title .inline-btn{font-family:var(--sans);font-size:12.5px;color:var(--green);letter-spacing:normal;text-transform:none;font-weight:600;}
  .section-title .st-cap{font-family:var(--mono);letter-spacing:normal;text-transform:none;color:var(--dim);font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}

  /* Dashboard hero + next-best-action + trend */
  .dash-hero{margin-top:22px;}
  .hero-card .card-value{font-size:36px;}
  .cv-unit{font-size:13px;color:var(--faint);font-weight:600;}
  .hero-card .cv-unit{color:#8a8a90;}
  .nba{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:var(--r-card);}
  .nba-icon{flex-shrink:0;color:var(--green);display:flex;}
  .nba-icon svg{width:20px;height:20px;}
  .nba-body{flex:1;min-width:0;}
  .nba-text{font-size:13.5px;color:var(--text);line-height:1.45;}
  .nba-note{color:var(--green);margin-left:4px;}
  .nba-cta{flex-shrink:0;}
  .nwt-x{display:flex;justify-content:space-between;margin-top:8px;}
  .nwt-x span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--faint);}
  .acheck{display:flex;align-items:flex-start;gap:9px;margin-top:4px;font-size:12.5px;color:var(--dim);line-height:1.4;cursor:pointer;}
  .acheck input{width:16px;height:16px;margin-top:1px;flex-shrink:0;accent-color:var(--green);}

  /* Month widgets */
  .month-widget{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 18px;text-align:left;transition:border-color .15s,transform .1s;position:relative;min-width:0;width:100%;}
  .month-widget:hover{border-color:var(--faint);transform:translateY(-1px);}
  .mw-top{display:flex;justify-content:space-between;align-items:center;}
  .mw-name{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;}
  .mw-dot{width:8px;height:8px;border-radius:50%;background:var(--card-3);}
  .mw-dot.ok{background:var(--green);}
  .mw-dot.over{background:var(--pink);}
  .mw-dot.closed{background:var(--amber);}
  .mw-value-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;min-width:0;}
  .mw-value{font-family:var(--mono);font-size:15.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mw-value.muted{color:var(--faint);font-weight:500;}
  .mw-pct{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--r-pill);background:var(--card-3);border:1px solid var(--border);color:var(--dim);flex-shrink:0;}
  .mw-pct.hot{color:var(--pink);border-color:rgba(248,113,113,.35);}
  .mw-sub{font-size:10.5px;color:var(--faint);margin-top:5px;font-family:var(--mono);}
  .month-widget.current{border-color:rgba(52,211,153,.4);}

  /* Bars */
  .bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:8px;}
  .bar-group{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;min-width:0;}
  .bar-pair{display:flex;gap:3px;align-items:flex-end;height:128px;}
  .bar{width:8px;border-radius:3px 3px 0 0;min-height:2px;}
  .bar-month{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);}
  .legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}

  .cat-row{display:grid;grid-template-columns:minmax(80px,130px) 1fr 100px;align-items:center;gap:12px;padding:8px 0;font-size:12.5px;}
  .cat-name{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat-track{height:10px;background:var(--card-3);border-radius:5px;overflow:hidden;}
  .cat-fill{height:100%;border-radius:5px;background:var(--green);}
  .cat-amt{text-align:right;font-family:var(--mono);color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;}

  /* Tables */
  .table-card{padding:6px 10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--border);}
  td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tfoot td{border-top:1px solid var(--border);border-bottom:none;font-weight:700;padding-top:12px;font-family:var(--mono);font-size:12px;}

  .cell-input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);padding:7px 8px;border-radius:9px;font-size:13px;min-width:64px;}
  .cell-input:hover{background:var(--card-2);}
  .cell-input:focus{background:var(--card-2);border-color:var(--faint);outline:none;}
  .cell-input.mono{font-family:var(--mono);text-align:right;}
  .cell-input.in{color:var(--green);}
  .cell-input.out{color:var(--pink);}
  .cur-select{background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:6px 4px;font-size:10.5px;color:var(--dim);font-family:var(--mono);appearance:none;text-align:center;width:52px;}
  .cur-select:focus{outline:none;border-color:var(--green);}
  .cat-select{width:104px;text-align:left;padding:6px 8px;}

  .tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--card-3);color:var(--dim);border:1px solid var(--border);white-space:nowrap;}
  .tag.over{color:var(--pink);border-color:rgba(248,113,113,.35);}
  .tag.under{color:var(--green);border-color:rgba(52,211,153,.35);}
  .tag.rec{color:var(--green);border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.06);}
  .tag.sav{color:#60A5FA;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.06);}
  .tag.closed{color:var(--amber);border-color:rgba(251,191,36,.35);}

  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--faint);width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{color:var(--pink);border-color:var(--faint);}
  .icon-btn svg{width:13px;height:13px;}

  .empty{padding:36px 20px;text-align:center;color:var(--faint);border:1px dashed var(--border);border-radius:var(--r-card);font-size:13px;}

  /* Month editor split layout */
  .mo-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:6px;}
  .mo-col{min-width:0;}
  .mo-col .section-title:first-child{margin-top:16px;}

  /* Donut + ring */
  .donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .donut-legend{display:flex;flex-direction:column;gap:7px;font-size:12px;flex:1;min-width:150px;}
  .dl-item{display:flex;align-items:center;gap:8px;color:var(--dim);}
  .dl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .dl-pct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);}
  .ring-wrap{display:flex;align-items:center;gap:20px;}
  .ring-stats{display:flex;flex-direction:column;gap:10px;}
  .ring-stat .rs-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .ring-stat .rs-value{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;}

  /* Insights */
  .insights{display:flex;flex-direction:column;gap:8px;}
  .insight{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--dim);padding:12px 15px;background:var(--card);border-radius:14px;border:1px solid var(--border);}
  .insight svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .insight.warn svg{color:var(--pink);}
  .insight.good svg{color:var(--green);}
  .insight.info svg{color:var(--dim);}

  /* Recurring, assets & goals */
  .rec-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 18px;}
  .rec-info{min-width:0;}
  .rec-name{font-weight:600;font-size:14.5px;}
  .rec-range{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px;}
  .rec-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .rec-amt{font-family:var(--mono);font-weight:700;font-size:14px;text-align:right;white-space:nowrap;overflow:hidden;}
  .rec-list{display:flex;flex-direction:column;gap:10px;}

  .goal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px;}
  .goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .goal-name{font-weight:700;font-size:16px;}
  .goal-deadline{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px;}
  .goal-track{height:12px;background:var(--card-3);border-radius:6px;overflow:hidden;margin:14px 0 10px;}
  .goal-fill{height:100%;border-radius:6px;background:var(--green);transition:width .3s;}
  .goal-nums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim);flex-wrap:wrap;gap:6px;}
  .goal-nums>span{white-space:nowrap;}
  .goal-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .goals-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .goals-grid>*{min-width:0;}

  .mini-goal{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .mini-goal:last-child{border-bottom:none;}
  .mg-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mg-track{height:7px;background:var(--card-3);border-radius:4px;overflow:hidden;margin-top:6px;}
  .mg-fill{height:100%;background:var(--green);border-radius:4px;}
  .mg-hint{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:5px;}

  /* Modal */
  /* z-index sits above the bottom tab bar (1100) so modal actions are never covered on mobile */
  .overlay{position:fixed;inset:0;background:rgba(4,4,6,.7);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:1300;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:24px 22px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
  @media(min-width:640px){
    .overlay{align-items:center;padding:20px;}
    .modal{border-radius:22px;padding:24px 22px;}
  }
  .modal h3{font-size:17px;font-weight:700;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:7px;font-weight:600;}
  .field input,.field select{width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:12px 13px;border-radius:13px;font-size:14px;appearance:none;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--green);}
  .field textarea{width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:12px 13px;border-radius:13px;font-size:11.5px;font-family:var(--mono);min-height:170px;resize:vertical;}
  .field textarea:focus{outline:none;border-color:var(--green);}
  .field input.mono{font-family:var(--mono);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .checkrow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);margin:4px 0 14px;}
  .checkrow input{width:17px;height:17px;accent-color:var(--green);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .seg button{flex:1;padding:11px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--card-2);color:var(--dim);font-size:13px;font-weight:600;}
  .seg button.on{background:var(--white);color:var(--ink);border-color:var(--white);}
  .rate-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-bottom:10px;}
  .rate-row .rr-label{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:600;}
  .rate-row input{width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:11px;font-size:13px;font-family:var(--mono);}
  .rate-row input:focus{outline:none;border-color:var(--green);}
  .rates-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:6px 0 14px;}
  .modal-note{font-size:12px;color:var(--faint);margin:-6px 0 14px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card-3);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:var(--r-pill);font-size:13px;z-index:2000;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}

  /* Auth gate */
  .gate{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:26px;gap:24px;width:100%;}
  .gate-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .gate-brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:15px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;}
  .gate-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(52,211,153,.6);}
  .gate-tag{color:var(--faint);font-size:13px;letter-spacing:.02em;}
  .gate-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px 26px;width:100%;max-width:410px;}
  .gate-card h2{font-size:22px;font-weight:700;margin-bottom:6px;}
  .gate-sub{color:var(--dim);font-size:13.5px;margin-bottom:18px;line-height:1.5;}
  .gate-msg{font-size:12.5px;margin-bottom:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);}
  .gate-msg.err{color:var(--pink);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.06);}
  .gate-msg.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.06);}
  .gate .btn{width:100%;justify-content:center;}
  .gate-foot{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;max-width:410px;line-height:1.6;}

  /* Mobile chrome: top bar, drawer, bottom tabs (hidden on desktop) */
  .mobile-topbar{display:none;position:sticky;top:0;z-index:1000;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);}
  .menu-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);color:var(--dim);
    display:flex;align-items:center;justify-content:center;background:transparent;flex-shrink:0;}
  .menu-btn:hover{color:var(--text);}
  .menu-btn svg{width:18px;height:18px;}
  .drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(4,4,6,.6);z-index:1150;opacity:0;
    pointer-events:none;transition:opacity .2s;}
  .drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:1100;
    background:var(--card);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .bn-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:8px 2px;border-radius:14px;color:var(--faint);background:transparent;}
  .bn-item svg{width:23px;height:23px;}
  .bn-item.active{color:var(--green);}
  .bn-item.active svg{filter:drop-shadow(0 0 8px rgba(52,211,153,.35));}
  .bn-dot{width:4px;height:4px;border-radius:50%;background:transparent;}
  .bn-item.active .bn-dot{background:var(--green);}

  /* Info tips */
  .info-btn{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);color:var(--faint);font-family:var(--mono);font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:6px;vertical-align:middle;background:transparent;padding:0;}
  .info-btn:hover{color:var(--text);border-color:var(--faint);}
  .card.invert .info-btn{border-color:#cfcfd3;color:#8a8a90;}
  .st-l{display:inline-flex;align-items:center;min-width:0;}
  .tipbox{position:fixed;z-index:3000;background:var(--card-3);border:1px solid var(--faint);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--text);line-height:1.5;box-shadow:0 12px 34px rgba(0,0,0,.55);max-width:280px;}

  /* Goal detail */
  .goal-card{cursor:pointer;}
  .gd-irow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--dim);padding:7px 0;border-bottom:1px solid var(--border);}
  .gd-irow:last-child{border-bottom:none;}
  .gd-row{display:grid;grid-template-columns:1fr 128px 34px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
  .gd-month{font-size:12.5px;color:var(--dim);}

  /* First-run tour */
  .tour-dim{position:fixed;inset:0;background:rgba(4,4,6,.55);z-index:2500;}
  .tour-glow{position:relative;z-index:2550;box-shadow:0 0 0 3px var(--green),0 10px 40px rgba(52,211,153,.25);border-radius:var(--r-card);}
  .tour-card{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:2600;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;width:calc(100% - 28px);max-width:430px;box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .tour-step{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:600;}
  .tour-title{font-size:16.5px;font-weight:700;margin:6px 0 6px;}
  .tour-text{font-size:13px;color:var(--dim);line-height:1.55;}
  .tour-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;}

  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- Responsive ---------- */
  @media(max-width:1150px){ .mo-layout{grid-template-columns:1fr;} }
  @media(max-width:1060px){
    .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .months-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .goals-grid{grid-template-columns:minmax(0,1fr);}
  }
  @media(max-width:860px){
    #app{flex-direction:column;}
    /* slim top bar shows the brand only; all navigation lives in the bottom bar */
    .mobile-topbar{display:flex;}
    .menu-btn{display:none;}
    /* the sidebar and its slide-in drawer are replaced by the bottom bar + the "More" sheet */
    .sidebar,.drawer-backdrop{display:none;}
    .bottom-nav{display:flex;}
    .main{padding:18px 16px 92px;}
    h1{font-size:27px;}
    .subtitle{font-size:16px;}
    .months-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .bars{gap:5px;height:130px;}
    .bar-pair{height:100px;gap:2px;}
    .bar{width:6px;}
    .cat-row{grid-template-columns:minmax(70px,100px) 1fr 90px;gap:8px;}
    .rec-card{flex-wrap:wrap;}
    .nba{flex-wrap:wrap;}
    .nba-cta{width:100%;justify-content:center;}
    .section-title{flex-wrap:wrap;}
  }
  @media(max-width:400px){
    .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .card{padding:15px 16px;}
    .card-value{font-size:18px;}
  }

  /* ---------- Mobile polish ---------- */
  @media(max-width:860px){
    html,body{overflow-x:hidden;}
    .page-head{flex-direction:column;align-items:stretch;gap:14px;}
    .yearswitch{align-self:flex-start;}
    /* 16px inputs prevent iOS auto-zoom on focus */
    .field input,.field select,.field textarea,.cell-input,.cur-select,.rate-row input{font-size:16px;}
    .cur-select{width:66px;}
    .cat-select{width:124px;}
    .card-value{font-size:19px;}
    .card-sub{font-size:10.5px;}
    .main{overflow-x:clip;}
    .month-widget{padding:14px 13px;min-width:0;max-width:100%;}
    .mw-value-row{min-width:0;gap:6px;}
    .mw-value{font-size:13px;}
    .mw-pct{font-size:9px;padding:3px 6px;}
    .donut-wrap{justify-content:center;}
    .ring-wrap{flex-wrap:wrap;justify-content:center;}
    .rec-card{align-items:flex-start;}
    .rec-right{width:100%;justify-content:flex-end;}
    .goal-nums{font-size:11.5px;}
    .actions .btn{flex:1;justify-content:center;min-width:0;}
    .table-card{padding:4px 6px;}
    th,td{padding:9px 6px;}
    .icon-btn{width:32px;height:32px;}
    .modal{max-width:100%;}
    .gate{padding:20px 16px;gap:20px;}
    .gate-card{padding:24px 18px;}
    .gate-card h2{font-size:20px;}
    .section-title{margin:24px 0 10px;}
    .main{padding:18px 14px 70px;}
  }
</style>
</head>

/* =============== storage & migration =============== */

function load(){
  try{
    var key = storageKey();
    var raw = localStorage.getItem(key);
    if(!raw && sbUser){
      // one-time adoption of data saved before login on this device
      var legacy = localStorage.getItem(STORAGE_KEY);
      if(legacy){
        raw = legacy;
        localStorage.setItem(key, legacy);
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
      }
    }
    if(raw){
      var p = JSON.parse(raw);
      if(p && typeof p==="object"){
        state.year = p.year || state.year;
        state.months = p.months || {};
        state.recurring = p.recurring || [];
        state.goals = p.goals || [];
        state.assets = p.assets || [];
        state.tourDone = !!p.tourDone;
        state.rates = p.rates || {};
        state.ratesUpdated = p.ratesUpdated || null;
        state.lastModified = p.lastModified || null;
      }
    }
  }catch(e){ storageOK=false; }
  CURRENCIES.forEach(function(c){
    if(c!=="KZT" && !(state.rates[c]>0)) state.rates[c]=DEFAULT_RATES[c]||1;
  });
  Object.keys(state.months).forEach(function(k){
    var m=state.months[k];
    if(!m.recActuals) m.recActuals={};
    (m.incomes||[]).forEach(function(i){ if(!i.cur) i.cur="KZT"; });
    (m.expenses||[]).forEach(function(e){
      if(!e.cur) e.cur="KZT";
      if(e.name==null){
        e.name = e.category||"";
        e.category = REC_CATEGORIES.indexOf(e.category)>=0 ? e.category : "Other";
      }
      if(!e.category) e.category="Other";
    });
  });
  state.recurring.forEach(function(r){
    if(!r.cur) r.cur="KZT";
    if(!r.category) r.category = r.type==="income" ? "Income" : "Other";
  });
  state.goals.forEach(function(g){ if(!g.contribs) g.contribs={}; });
  state.assets.forEach(function(a){ if(!a.cur) a.cur="KZT"; if(!a.kind) a.kind="asset"; if(a.kind!=="liability" && a.liquid===undefined) a.liquid=true; });
}

function save(){
  state.lastModified = Date.now();
  try{
    localStorage.setItem(storageKey(), JSON.stringify(state));
    flashSaved();
    schedulePush();
  }catch(e){
    storageOK=false;
    if(!warned){ toast("Saving unavailable (private mode?) \u2014 export CSV to keep data"); warned=true; }
    updateSavedBadge();
  }
}
function flashSaved(){
  var b=document.getElementById("saved-badge");
  if(!b) return;
  b.classList.add("flash");
  setTimeout(function(){ b.classList.remove("flash"); },400);
}
function updateSavedBadge(){
  var b=document.getElementById("saved-badge");
  if(!b) return;
  if(storageOK){ b.className="badge saved"; b.innerHTML="\u2713 auto-saved on this device"; }
  else{ b.className="badge warn"; b.innerHTML="\u26A0 saving unavailable"; }
}

/* =============== rates =============== */

function refreshRates(cb){
  if(typeof fetch!=="function"){ if(cb) cb(false); return; }
  fetch(RATES_URL).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.result==="success" && d.rates){
      CURRENCIES.forEach(function(c){
        if(c!=="KZT" && d.rates[c]>0) state.rates[c] = 1/d.rates[c];
      });
      state.ratesUpdated = Date.now();
      save();
      if(cb) cb(true);
    }else if(cb) cb(false);
  }).catch(function(){ if(cb) cb(false); });
}
function ratesStale(){
  return !state.ratesUpdated || (Date.now()-state.ratesUpdated) > 24*3600*1000;
}
function toKZT(amount,cur){
  var n=Number(amount)||0;
  if(!cur || cur==="KZT") return n;
  return n * (Number(state.rates[cur])||1);
}

function pad2(n){ return (n<10?"0":"")+n; }
function mk(y,m){ return y+"-"+pad2(m); }
function keyYear(k){ return parseInt(k.slice(0,4),10); }
function keyMonth(k){ return parseInt(k.slice(5,7),10); }
function nowKey(){ var d=new Date(); return mk(d.getFullYear(),d.getMonth()+1); }
function isPast(k){ return k < nowKey(); }
function shiftKey(k,delta){
  var d=new Date(keyYear(k), keyMonth(k)-1+delta, 1);
  return mk(d.getFullYear(), d.getMonth()+1);
}
function labelFull(k){ return MONTH_FULL[keyMonth(k)-1]+" "+keyYear(k); }
function labelShortKey(k){ return MONTH_SHORT[keyMonth(k)-1]+" "+keyYear(k); }
function monthsBetween(fromK,toK){
  var d=(keyYear(toK)-keyYear(fromK))*12 + (keyMonth(toK)-keyMonth(fromK));
  return d<0?0:d+1;
}

function fmtNum(n){
  return (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtCur(n,cur){
  n=Number(n)||0;
  var sym=CUR_SYMBOLS[cur]||cur+" ";
  var neg=n<0;
  return (neg?"\u2212":"")+sym+fmtNum(Math.abs(n));
}
function fmt(n){ return fmtCur(n,"KZT"); }
function parseAmt(v){
  var n=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(/,/g,""));
  return isFinite(n)?n:0;
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toast(msg){
  var el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); },2600);
}

/* =============== data model =============== */

function ensureMonth(k){
  if(!state.months[k]) state.months[k]={incomes:[],expenses:[],recActuals:{}};
  if(!state.months[k].recActuals) state.months[k].recActuals={};
  return state.months[k];
}
function recurringForMonth(k){
  return state.recurring.filter(function(r){ return r.start<=k && (!r.end || k<=r.end); });
}
// What a recurring expense actually cost in month k:
// an explicitly recorded actual always wins; otherwise assume the payment
// happened at its defined amount once the month is current or past.
function recEffectiveActual(k,m,r){
  if(m && m.recActuals && m.recActuals[r.id]!=null) return Number(m.recActuals[r.id])||0;
  return k<=nowKey() ? (Number(r.amount)||0) : 0;
}
function savedInMonth(k){
  var s=0;
  state.goals.forEach(function(g){ s += Number(g.contribs[k])||0; });
  return s;
}
function goalSaved(g){
  var s=0;
  Object.keys(g.contribs).forEach(function(k){ s+=Number(g.contribs[k])||0; });
  return s;
}
function totalGoalsSaved(){
  return state.goals.reduce(function(s,g){ return s+goalSaved(g); },0);
}
function goalNeededPerMonth(g){
  var remaining=Math.max(0,(Number(g.target)||0)-goalSaved(g));
  if(!g.deadline) return null;
  var left=monthsBetween(nowKey(),g.deadline);
  if(left<=0) return remaining;
  return remaining/left;
}
function hasData(k){
  var m=state.months[k];
  if(m && (m.incomes.length||m.expenses.length)) return true;
  if(m && m.recActuals && Object.keys(m.recActuals).length) return true;
  if(m && m.closed) return true;
  if(savedInMonth(k)>0) return true;
  return recurringForMonth(k).length>0;
}

// Savings contributions count as expenses of the month (planned & actual).
function monthTotals(k){
  var m=state.months[k];
  var recs=recurringForMonth(k);
  var income=0,planned=0,actual=0;
  recs.forEach(function(r){
    var amt=toKZT(r.amount,r.cur);
    if(r.type==="income"){ income+=amt; }
    else{
      planned+=amt;
      actual+=toKZT(recEffectiveActual(k,m,r),r.cur);
    }
  });
  if(m){
    m.incomes.forEach(function(i){ income+=toKZT(i.amount,i.cur); });
    m.expenses.forEach(function(e){
      planned+=toKZT(e.planned,e.cur);
      actual+=toKZT(e.actual,e.cur);
    });
  }
  var saved=savedInMonth(k);
  planned+=saved;
  actual+=saved;
  var free=income-planned;
  var spentPct = income>0 ? Math.round((actual/income)*100) : 0;
  return {income:income,planned:planned,actual:actual,saved:saved,free:free,deviation:actual-planned,spentPct:spentPct};
}

// what the widgets/aggregates treat as "free" for a month
function displayFree(k){
  var m=state.months[k];
  if(m && m.closed) return {val:Number(m.leftover)||0, state:"closed"};
  if(isPast(k)) return {val:0, state:"past"};
  return {val:monthTotals(k).free, state:"open"};
}

function bankedTotal(){
  var s=0;
  Object.keys(state.months).forEach(function(k){
    var m=state.months[k];
    if(m && m.closed) s+=Number(m.leftover)||0;
  });
  return s;
}
function assetsTotal(){
  return state.assets.reduce(function(s,a){
    var v=toKZT(a.value,a.cur);
    return s + (a.kind==="liability" ? -v : v);
  },0);
}
function netWorth(){
  return assetsTotal() + totalGoalsSaved() + bankedTotal();
}

function yearTotals(y){
  var t={income:0,planned:0,actual:0,saved:0,deviation:0,monthsWithData:0};
  for(var m=1;m<=12;m++){
    var k=mk(y,m);
    if(!hasData(k)) continue;
    var mt=monthTotals(k);
    t.income+=mt.income;t.planned+=mt.planned;t.actual+=mt.actual;t.saved+=mt.saved;
    t.deviation+=mt.deviation;t.monthsWithData++;
  }
  return t;
}

/* ---- health metrics (savings rate, runway, fixed-cost ratio, net-worth trend) ---- */

// Categories treated as "essential" when computing the emergency-fund runway.
var ESSENTIAL_CATEGORIES = {"Housing":1,"Groceries":1,"Food":1,"Debts & loans":1,"Transport":1,"Health":1,"Family":1};

function isLiquidAsset(a){ return a.kind!=="liability" && a.liquid!==false; }
function liquidAssetsTotal(){
  return state.assets.reduce(function(s,a){ return s + (isLiquidAsset(a)?toKZT(a.value,a.cur):0); },0);
}

// Essential actual spending for a month, in KZT.
function essentialSpendInMonth(k){
  var m=state.months[k], total=0;
  recurringForMonth(k).forEach(function(r){
    if(r.type==="expense" && ESSENTIAL_CATEGORIES[r.category]) total+=toKZT(recEffectiveActual(k,m,r),r.cur);
  });
  if(m) m.expenses.forEach(function(e){
    if(ESSENTIAL_CATEGORIES[e.category]) total+=toKZT(e.actual,e.cur);
  });
  return total;
}

// Trailing average monthly spend over up to n months with data (ending at the current month).
function avgMonthlySpend(n,essentialOnly){
  n=n||3;
  var k=nowKey(), sum=0, cnt=0;
  for(var i=0;i<n;i++){
    var kk=shiftKey(k,-i);
    if(!hasData(kk)) continue;
    sum += essentialOnly ? essentialSpendInMonth(kk) : monthTotals(kk).actual;
    cnt++;
  }
  return cnt ? sum/cnt : 0;
}

// Months of liquid runway. Prefers essential spend; falls back to total spend. Null if unknowable.
function runwayMonths(){
  var burn=avgMonthlySpend(3,true);
  if(burn<=0) burn=avgMonthlySpend(3,false);
  if(burn<=0) return null;
  return liquidAssetsTotal()/burn;
}

// Recurring expense commitments effective in a month, in KZT (the "fixed" cost floor).
function fixedCostsMonthly(k){
  k=k||nowKey();
  var total=0;
  recurringForMonth(k).forEach(function(r){ if(r.type==="expense") total+=toKZT(r.amount,r.cur); });
  return total;
}

// Savings rate for a year: saved / income. Null if no income.
function savingsRate(y){
  var t=yearTotals(y);
  return t.income>0 ? t.saved/t.income : null;
}

// Net worth at the end of month k. Assets are treated as a constant baseline (no per-month
// history exists for them); goal contributions and banked leftovers carry real dates, so we
// walk them back from today. The latest point therefore equals netWorth() exactly.
function netWorthAt(k){
  var nw=netWorth();
  state.goals.forEach(function(g){
    Object.keys(g.contribs).forEach(function(ck){ if(ck>k) nw-=Number(g.contribs[ck])||0; });
  });
  Object.keys(state.months).forEach(function(mk2){
    var m=state.months[mk2];
    if(m && m.closed && mk2>k) nw-=Number(m.leftover)||0;
  });
  return nw;
}
function netWorthSeries(y){
  var arr=[];
  for(var mo=1;mo<=12;mo++) arr.push(netWorthAt(mk(y,mo)));
  return arr;
}
// This month's net-worth change (contributions + anything banked this month).
function netWorthDeltaThisMonth(){
  return netWorth()-netWorthAt(shiftKey(nowKey(),-1));
}

function monthCategoryBreakdown(k,mode){
  var m=state.months[k];
  var map={};
  function add(name,val){
    if(val>0){ name=name||"Unnamed"; map[name]=(map[name]||0)+val; }
  }
  recurringForMonth(k).forEach(function(r){
    if(r.type!=="expense") return;
    if(mode==="planned") add(r.category, toKZT(r.amount,r.cur));
    else add(r.category, toKZT(recEffectiveActual(k,m,r),r.cur));
  });
  if(m) m.expenses.forEach(function(e){
    add(e.category, toKZT(mode==="planned"?e.planned:e.actual, e.cur));
  });
  var sv=savedInMonth(k);
  if(sv>0) add("Savings", sv);
  var arr=Object.keys(map).map(function(n){ return {name:n,val:map[n]}; });
  arr.sort(function(a,b){ return b.val-a.val; });
  return arr;
}
function yearCategoryAggregates(y){
  var map={};
  for(var mo=1;mo<=12;mo++){
    monthCategoryBreakdown(mk(y,mo),"actual").forEach(function(c){
      map[c.name]=(map[c.name]||0)+c.val;
    });
  }
  var arr=Object.keys(map).map(function(n){ return {name:n,val:map[n]}; });
  arr.sort(function(a,b){ return b.val-a.val; });
  return arr;
}

/* =============== charts (SVG) =============== */

function donutSvg(entries,size){
  size=size||130;
  var total=entries.reduce(function(s,e){ return s+e.val; },0);
  if(total<=0) return "";
  var r=(size/2)-12, cx=size/2, cy=size/2, C=2*Math.PI*r, off=0;
  var segs=entries.map(function(e,i){
    var len=(e.val/total)*C;
    var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+PIE_COLORS[i%PIE_COLORS.length]+'" stroke-width="18" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;
    return s;
  }).join("");
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+segs+'</svg>';
}
function donutCard(title,entries,infoKey){
  var lbl='<div class="card-label"><span class="st-l">'+title+'</span>'+(infoKey?infoBtn(infoKey):'')+'</div>';
  if(!entries.length) return '<div class="card">'+lbl+'<div class="empty" style="border:none;padding:22px;">'+tt("No data yet.")+'</div></div>';
  var total=entries.reduce(function(s,e){ return s+e.val; },0);
  var top=entries.slice(0,8);
  var legend=top.map(function(e,i){
    return '<div class="dl-item"><span class="dl-dot" style="background:'+PIE_COLORS[i%PIE_COLORS.length]+'"></span>'
      +'<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(catLabel(e.name))+'</span>'
      +'<span class="dl-pct">'+Math.round(e.val/total*100)+'%</span></div>';
  }).join("");
  return '<div class="card">'+lbl
    +'<div class="donut-wrap">'+donutSvg(top)+'<div class="donut-legend">'+legend+'</div></div></div>';
}
function ringSvg(pct,color,size){
  size=size||110;
  var r=(size/2)-10, cx=size/2, cy=size/2, C=2*Math.PI*r;
  var p=Math.max(0,Math.min(100,pct));
  var len=C*p/100;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--card-3)" stroke-width="12"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+len+' '+(C-len)+'" transform="rotate(-90 '+cx+' '+cy+')"/>'
    +'<text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="var(--text)">'+Math.round(pct)+'%</text>'
    +'</svg>';
}

// One contextual "next best action", driven by the health metrics above.
function nextBestAction(){
  var cur=nowKey(), openPast=null;
  Object.keys(state.months).forEach(function(k){
    var m=state.months[k];
    if(k<cur && m && !m.closed && hasData(k) && (!openPast||k>openPast)) openPast=k;
  });
  if(openPast) return {text:tt("Close a finished month to bank its leftover into net worth."), note:labelFull(openPast), view:"month", key:openPast, cta:tt("Open")};
  var rw=runwayMonths();
  if(rw!==null && rw<3) return {text:tt("Build your safety net toward 3\u20136 months of expenses."), note:rw.toFixed(1)+" "+tt("mo"), view:"savings", cta:tt("Savings")};
  var free=monthTotals(cur).free;
  if(free>0 && state.goals.length) return {text:tt("You have free cash this month \u2014 push some toward a goal."), note:fmt(free), view:"savings", cta:tt("Savings")};
  if(!state.goals.length) return {text:tt("Set your first savings goal \u2014 a cushion, a trip, a big purchase."), note:"", view:"savings", cta:tt("Savings")};
  return {text:tt("You're on track \u2014 keep planning ahead."), note:"", view:null, cta:""};
}

function renderNetWorthTrend(){
  var c=document.getElementById("nw-trend");
  if(!c) return;
  var series=netWorthSeries(state.year);
  var hasAny=netWorth()!==0 || series.some(function(v){ return v!==0; });
  if(!hasAny){ c.innerHTML='<div class="empty" style="border:none;">'+tt("Add assets or savings to see your net worth grow.")+'</div>'; return; }
  var W=640,H=150,pad=10;
  var min=Math.min.apply(null,series), max=Math.max.apply(null,series);
  if(min>0) min=0;                 // anchor baseline at zero when everything is positive
  if(max===min) max=min+1;
  var n=series.length;
  function px(i){ return pad + i*((W-2*pad)/(n-1)); }
  function py(v){ return H-pad - ((v-min)/(max-min))*(H-2*pad); }
  var line=series.map(function(v,i){ return (i?"L":"M")+px(i).toFixed(1)+" "+py(v).toFixed(1); }).join(" ");
  var area="M"+px(0).toFixed(1)+" "+(H-pad)+" "+series.map(function(v,i){ return "L"+px(i).toFixed(1)+" "+py(v).toFixed(1); }).join(" ")+" L"+px(n-1).toFixed(1)+" "+(H-pad)+" Z";
  var curIdx=(keyYear(nowKey())===state.year)?(keyMonth(nowKey())-1):(n-1);
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px;display:block;">'
    +'<path d="'+area+'" fill="var(--green)" opacity="0.08"/>'
    +'<path d="'+line+'" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    +'<circle cx="'+px(curIdx).toFixed(1)+'" cy="'+py(series[curIdx]).toFixed(1)+'" r="3.5" fill="var(--green)" vector-effect="non-scaling-stroke"/>'
    +'</svg>';
  var xlabels='<div class="nwt-x">';
  for(var i=0;i<12;i++) xlabels+='<span>'+MONTH_SHORT[i].charAt(0)+'</span>';
  xlabels+='</div>';
  c.innerHTML=svg+xlabels;
}

function renderYearBars(){
  var container=document.getElementById("year-bars");

    var t=hasData(k)?monthTotals(k):{income:0,actual:0,planned:0};
    if(hasData(k)) any=true;
    data.push(t);

  if(!any){ container.innerHTML='<div class="empty" style="border:none;">'+tt("Nothing logged in")+' '+y+'</div>'; return; }

      +'<div class="bar" style="height:'+Math.max(inH,2)+'px;background:var(--green);opacity:'+(data[i].income>0?1:0.15)+'"></div>'
      +'<div class="bar" style="height:'+Math.max(acH,2)+'px;background:'+(overP?"var(--pink)":"var(--white)")+';opacity:'+(data[i].actual>0?0.9:0.12)+'"></div>'

  }
  if(banked>0){
    autoRows+='<div class="rec-card"><div class="rec-info"><div class="rec-name">'+tt("Banked leftovers")+' <span class="tag closed">'+tt("auto")+'</span></div>'
      +'<div class="rec-range">'+tt("from closed months")+'</div></div>'
      +'<div class="rec-right"><div class="rec-amt amber">'+fmt(banked)+'</div></div></div>';
  }
  if(!state.assets.length && !autoRows){
    container.innerHTML='<div class="empty">'+tt("Add what you own (deposits, car, apartment share\u2026) and what you owe. Net worth = assets \u2212 liabilities + savings + banked leftovers.")+'</div>';
    return;
  }
  container.innerHTML=autoRows+state.assets.map(function(a){
    var isL=a.kind==="liability";
    var kztNote=a.cur!=="KZT"?" \u00B7 \u2248 "+fmt(toKZT(a.value,a.cur)):"";
    var liqNote=(!isL && a.liquid===false)?" \u00B7 "+tt("not liquid"):"";
    return '<div class="rec-card">'
      +'<div class="rec-info"><div class="rec-name">'+esc(a.name)
      +' <span class="tag '+(isL?"over":"under")+'">'+tt(ASSET_KINDS[a.kind])+'</span></div>'
      +'<div class="rec-range">'+esc(a.cur)+kztNote+liqNote+'</div></div>'
      +'<div class="rec-right">'
      +'<div class="rec-amt '+(isL?"pink":"green")+'">'+(isL?"\u2212":"+")+fmtCur(a.value,a.cur)+'</div>'
      +'<button class="icon-btn" data-edit="'+a.id+'">'+editIcon()+'</button>'
      +'<button class="icon-btn" data-del="'+a.id+'">'+trashIcon()+'</button>'
      +'</div></div>';
  }).join("");
  container.querySelectorAll("[data-edit]").forEach(function(b){ b.onclick=function(){ openAssetModal(b.dataset.edit); }; });
  container.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){
      var a=state.assets.find(function(x){ return x.id===b.dataset.del; });
      confirmModal('Remove "'+(a?a.name:"")+'" from net worth?',function(){
        state.assets=state.assets.filter(function(x){ return x.id!==b.dataset.del; });
        save(); render();
      });
    };
  });
}

function openAssetModal(id){
  var existing=id?state.assets.find(function(a){ return a.id===id; }):null;
  var kind=existing?existing.kind:"asset";
  var body=document.createElement("div");
  body.innerHTML=''
    +'<div class="seg">'
    +'<button type="button" data-kind="asset" class="'+(kind==="asset"?"on":"")+'">'+tt("Asset")+'</button>'
    +'<button type="button" data-kind="liability" class="'+(kind==="liability"?"on":"")+'">'+tt("Liability")+'</button>'
    +'</div>'
    +'<div class="field"><label>'+tt("Name")+'</label><input id="a-name" value="'+(existing?esc(existing.name):"")+'" placeholder="'+tt("Name")+'"></div>'
    +'<div class="field-row">'
    +'<div class="field" style="flex:2;"><label>'+tt("Value")+'</label><input id="a-value" class="mono" data-amt type="text" inputmode="decimal" value="'+(existing&&existing.value?fmtNum(existing.value):"")+'" placeholder="0.00"></div>'
    +'<div class="field"><label>'+tt("Currency")+'</label><select id="a-cur">'+CURRENCIES.map(function(c){ return '<option '+((existing?existing.cur:"KZT")===c?"selected":"")+'>'+c+'</option>'; }).join("")+'</select></div>'
    +'</div>'
    +'<label class="acheck" id="a-liquid-row" style="'+(kind==="asset"?"":"display:none;")+'"><input type="checkbox" id="a-liquid" '+((!existing||existing.liquid!==false)?"checked":"")+'><span>'+tt("Liquid — cash you could reach quickly (counts toward safety runway)")+'</span></label>';
  body.querySelectorAll("[data-kind]").forEach(function(btn){
    btn.onclick=function(){
      kind=btn.dataset.kind;
      body.querySelectorAll("[data-kind]").forEach(function(b2){ b2.classList.toggle("on",b2.dataset.kind===kind); });
      var lr=body.querySelector("#a-liquid-row"); if(lr) lr.style.display=(kind==="asset"?"":"none");
    };
  });
  attachAmtFormat(body);
  openModal(existing?tt("Edit item"):tt("Add to net worth"), body, function(){
    var name=body.querySelector("#a-name").value.trim();
    var value=parseAmt(body.querySelector("#a-value").value);
    if(!name){ toast(tt("Name it")); return false; }
    if(!value||value<=0){ toast(tt("Enter a valid value")); return false; }
    var cur=body.querySelector("#a-cur").value;
    var liquid = kind==="asset" ? body.querySelector("#a-liquid").checked : false;
    if(existing){ existing.name=name; existing.kind=kind; existing.value=value; existing.cur=cur; existing.liquid=liquid; }
    else state.assets.push({id:uid(),name:name,kind:kind,value:value,cur:cur,liquid:liquid});
    save(); render();
    return true;
  });
}

/* =============== Month editor =============== */

  state.year=keyYear(k);
  view="month";
  save();
  render();
}

  +(closable?'<button class="btn btn-primary btn-small" id="close-month">'+tt("Close month \u00B7 bank the leftover")+'</button>':'')

  +'  <div class="mo-col">'

  +'    <div class="card table-card scroll-x" id="income-card"></div>'
  +'    <div class="section-title"><span class="st-l">'+tt("Expenses")+infoBtn("sec_expenses")+'</span><button class="inline-btn" id="add-expense">'+tt("+ Add expense")+'</button></div>'

  +'    <div class="card" id="savings-card"></div>'
  +'  </div>'
  +'  <div class="mo-col">'
  +'    <div class="section-title">'+tt("Month analytics")+'</div>'
  +'    <div class="card" id="ring-card"></div>'
  +'    <div style="height:12px;"></div>'
  +'    <div id="pie-actual"></div>'
  +'    <div style="height:12px;"></div>'
  +'    <div id="pie-planned"></div>'
  +'    <div class="section-title"><span class="st-l">'+tt("Insights")+infoBtn("insights_info")+'</span></div>'
  +'    <div class="insights" id="mo-insights"></div>'
  +'  </div>'
  +'</div>'
  +'<datalist id="cat-list"></datalist>'

  document.getElementById("mo-next").onclick=function(){ openMonth(shiftKey(k,1)); };

    document.getElementById("copy-prev").onclick=function(){
      prevM.expenses.forEach(function(e){
        m.expenses.push({id:uid(),name:e.name||"",category:e.category||"Other",planned:e.planned,actual:0,cur:e.cur||"KZT"});

      save(); render();

      m.closed=false; delete m.leftover;

function openCloseMonthModal(k){
  var m=ensureMonth(k);
  var t=monthTotals(k);
  var suggested=Math.max(0, t.income - t.actual);
  var body=document.createElement("div");
  body.innerHTML=''
    +'<div class="modal-note">'+tt("How much money is actually left at the end of")+' '+esc(labelFull(k))+'? '+tt("It will be added to your net worth as a banked leftover.")+'</div>'
    +'<div class="field"><label>'+tt("Leftover (KZT)")+'</label><input id="cm-amt" class="mono" data-amt type="text" inputmode="decimal" value="'+fmtNum(suggested)+'" placeholder="0.00"></div>'
    +'<div class="modal-note">'+tt("Suggested")+': '+tt("Income")+' '+fmt(t.income)+' \u2212 '+tt("Spent").toLowerCase()+' '+fmt(t.actual)+' = '+fmt(t.income-t.actual)+'</div>';
  attachAmtFormat(body);
  openModal(tt("Close")+" "+MONTH_FULL[keyMonth(k)-1], body, function(){
    var amt=parseAmt(body.querySelector("#cm-amt").value);
    if(amt<0){ toast(tt("Leftover cannot be negative")); return false; }
    m.closed=true;
    m.leftover=amt;
    save(); render();
    toast(labelFull(k)+" "+tt("closed \u2014")+" "+fmt(amt)+" "+tt("banked"));
    return true;
  });
}

function openIncomeModal(k){
  var m=ensureMonth(k);
  var body=document.createElement("div");
  body.innerHTML=''
    +'<div class="field"><label>'+tt("Source")+'</label><input id="in-name" list="inc-list" placeholder="'+tt("Source")+'"></div>'
    +'<div class="field-row">'
    +'<div class="field" style="flex:2;"><label>'+tt("Amount")+'</label><input id="in-amt" class="mono" data-amt type="text" inputmode="decimal" placeholder="0.00"></div>'

  openModal(tt("Add income")+" \u00B7 "+labelShortKey(k), body, function(){
    var name=body.querySelector("#in-name").value.trim();
    var amt=parseAmt(body.querySelector("#in-amt").value);

function openExpenseModal(k){
  var m=ensureMonth(k);
  var body=document.createElement("div");
  body.innerHTML=''
    +'<div class="field"><label>'+tt("Name")+'</label><input id="ex-name" list="cat-list" placeholder="'+tt("Name")+'"></div>'
    +'<div class="field"><label>'+tt("Category")+'</label><select id="ex-cat">'

function fillDatalists(){
  var cats={},incs={};
  Object.keys(state.months).forEach(function(k){
    state.months[k].expenses.forEach(function(e){ if(e.name) cats[e.name]=1; });
    state.months[k].incomes.forEach(function(i){ if(i.name) incs[i.name]=1; });
  });
  var cl=document.getElementById("cat-list"), il=document.getElementById("inc-list");
  if(cl) cl.innerHTML=Object.keys(cats).map(function(c){ return '<option value="'+esc(c)+'">'; }).join("");
  if(il) il.innerHTML=Object.keys(incs).map(function(c){ return '<option value="'+esc(c)+'">'; }).join("");
}

function refreshMonthEditor(){
  var k=openMonthKey;
  var m=ensureMonth(k);
  var t=monthTotals(k);
  var stats=document.getElementById("mo-stats");
  if(stats){
    var lastCard;
    if(m.closed){
      lastCard='<div class="card invert"><div class="card-label"><span class="st-l">'+tt("Banked")+' \u2713</span>'+infoBtn("mo_banked")+'</div><div class="card-value">'+fmt(m.leftover||0)+'</div>'
        +'<div class="card-sub">'+tt("added to net worth")+'</div></div>';
    }else if(isPast(k)){
      lastCard='<div class="card invert"><div class="card-label"><span class="st-l">'+tt("Month passed")+'</span>'+infoBtn("mo_passed")+'</div><div class="card-value">'+fmt(0)+'</div>'
        +'<div class="card-sub">'+tt("close it to bank what is left")+'</div></div>';
    }else{
      lastCard='<div class="card invert"><div class="card-label"><span class="st-l">'+tt("Free to spend")+' \u2728</span>'+infoBtn("mo_free")+'</div><div class="card-value">'+fmt(t.free)+'</div>'
        +'<div class="card-sub">'+tt("income \u2212 plan (incl. savings)")+'</div></div>';
    }
    stats.innerHTML=''
    +'<div class="card"><div class="card-label"><span class="st-l">'+tt("Income")+'</span>'+infoBtn("mo_income")+'</div><div class="card-value green">'+fmt(t.income)+'</div></div>'
    +'<div class="card"><div class="card-label"><span class="st-l">'+tt("Spent")+'</span>'+infoBtn("mo_spent")+'</div><div class="card-value '+(t.deviation>0?"pink":"")+'">'+fmt(t.actual)+'</div>'
    +'<div class="card-sub">'+t.spentPct+'% '+tt("of income")+' \u00B7 '+tt("planned")+' '+fmt(t.planned)+'</div></div>'
    +'<div class="card"><div class="card-label"><span class="st-l">'+tt("Saved")+'</span>'+infoBtn("mo_saved")+'</div><div class="card-value green">'+fmt(t.saved)+'</div>'
    +'<div class="card-sub">'+tt("counted in expenses")+'</div></div>'

  renderExpenseTable();

  renderSidebar();
  scheduleFit();

function renderIncomeTable(){
  var k=openMonthKey;
  var m=ensureMonth(k);
  var recInc=recurringForMonth(k).filter(function(r){ return r.type==="income"; });
  var container=document.getElementById("income-card");
  var t=monthTotals(k);

  if(!m.incomes.length&&!recInc.length){
    container.innerHTML='<div class="empty" style="border:none;">'+tt("No income yet. Add salary, bonus \u2014 or set it up once in Recurring.")+'</div>';
    return;
  }
  var rows="";
  recInc.forEach(function(r){
    rows+='<tr><td style="padding-left:8px;">'+esc(r.name)+' <span class="tag rec">'+tt("recurring")+'</span></td>'
      +'<td style="text-align:right;" class="mono green">'+fmtCur(r.amount,r.cur)+'</td><td></td><td></td></tr>';
  });
  m.incomes.forEach(function(i){
    rows+='<tr data-id="'+i.id+'">'
      +'<td><input class="cell-input" list="inc-list" data-f="name" value="'+esc(i.name)+'" placeholder="'+tt("Source")+'"></td>'
      +'<td><input class="cell-input mono in" data-f="amount" type="text" inputmode="decimal" value="'+(i.amount?fmtNum(i.amount):"")+'" placeholder="0.00"></td>'
      +'<td>'+curSelectHtml('data-f="cur"',i.cur||"KZT")+'</td>'
      +'<td><button class="icon-btn" data-del>'+trashIcon()+'</button></td></tr>';
  });
  container.innerHTML='<table id="income-table" style="min-width:380px;"><thead><tr><th>'+tt("Source")+'</th><th style="text-align:right;">'+tt("Amount")+'</th><th></th><th style="width:38px;"></th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td>'+tt("Total (KZT)")+'</td><td style="text-align:right;">'+fmt(t.income)+'</td><td></td><td></td></tr></tfoot></table>';

  container.querySelectorAll("tbody tr[data-id]").forEach(function(row){
    var item=m.incomes.find(function(i){ return i.id===row.dataset.id; });
    row.querySelectorAll("[data-f]").forEach(function(inp){
      inp.addEventListener("change",function(){
        var f=inp.dataset.f;
        item[f]= f==="amount" ? parseAmt(inp.value) : inp.value;
        save(); refreshMonthEditor();
      });
    });
    row.querySelector("[data-del]").onclick=function(){
      m.incomes=m.incomes.filter(function(i){ return i.id!==row.dataset.id; });
      save(); refreshMonthEditor();
    };
  });
}

function renderExpenseTable(){
  var k=openMonthKey;
  var m=ensureMonth(k);
  var recExp=recurringForMonth(k).filter(function(r){ return r.type==="expense"; });
  var container=document.getElementById("expense-card");
  var t=monthTotals(k);
  var savRows=state.goals.filter(function(g){ return (Number(g.contribs[k])||0)>0; });

  if(!m.expenses.length&&!recExp.length&&!savRows.length){
    container.innerHTML='<div class="empty" style="border:none;">'+tt("No planned expenses yet.")+'</div>';
    return;
  }
  function varianceTag(planned,actual,cur){
    var dev=(Number(actual)||0)-(Number(planned)||0);
    if(dev>0) return '<span class="tag over">+'+fmtCur(dev,cur)+'</span>';
    if(dev<0) return '<span class="tag under">'+fmtCur(dev,cur)+'</span>';
    return '<span class="tag">'+tt("on plan")+'</span>';
  }
  var rows="";
  recExp.forEach(function(r){
    var recorded=(m.recActuals[r.id]!=null)?m.recActuals[r.id]:"";
    var eff=recEffectiveActual(k,m,r);
    rows+='<tr data-rec="'+r.id+'">'
      +'<td style="padding-left:8px;white-space:nowrap;">'+esc(r.name)+' <span class="tag rec">'+tt("recurring")+'</span></td>'
      +'<td><span class="tag">'+esc(catLabel(r.category))+'</span></td>'
      +'<td style="text-align:right;" class="mono">'+fmtCur(r.amount,r.cur)+'</td>'
      +'<td><input class="cell-input mono out" data-recactual type="text" inputmode="decimal" value="'+(recorded!==""?fmtNum(recorded):"")+'" placeholder="'+fmtNum(eff)+'"></td>'
      +'<td style="text-align:center;" class="mono">'+(r.cur||"KZT")+'</td>'
      +'<td style="text-align:right;">'+varianceTag(r.amount,eff,r.cur)+'</td>'
      +'<td></td></tr>';
  });
  savRows.forEach(function(g){
    var c=Number(g.contribs[k])||0;
    rows+='<tr><td style="padding-left:8px;white-space:nowrap;">\u2192 '+esc(g.name)+' <span class="tag sav">'+tt("savings")+'</span></td>'
      +'<td><span class="tag">'+catLabel("Savings")+'</span></td>'
      +'<td style="text-align:right;" class="mono">'+fmtNum(c)+'</td>'
      +'<td style="text-align:right;" class="mono">'+fmtNum(c)+'</td>'
      +'<td style="text-align:center;" class="mono">KZT</td>'
      +'<td style="text-align:right;"><span class="tag">'+tt("on plan")+'</span></td><td></td></tr>';
  });
  m.expenses.forEach(function(e){
    rows+='<tr data-id="'+e.id+'">'
      +'<td><input class="cell-input" list="cat-list" data-f="name" value="'+esc(e.name)+'" placeholder="'+tt("Name")+'"></td>'
      +'<td>'+catSelectHtml('data-f="category"',e.category||"Other")+'</td>'
      +'<td><input class="cell-input mono" data-f="planned" type="text" inputmode="decimal" value="'+(e.planned?fmtNum(e.planned):"")+'" placeholder="0.00"></td>'
      +'<td><input class="cell-input mono out" data-f="actual" type="text" inputmode="decimal" value="'+(e.actual?fmtNum(e.actual):"")+'" placeholder="0.00"></td>'
      +'<td>'+curSelectHtml('data-f="cur"',e.cur||"KZT")+'</td>'
      +'<td style="text-align:right;">'+varianceTag(e.planned,e.actual,e.cur)+'</td>'
      +'<td><button class="icon-btn" data-del>'+trashIcon()+'</button></td></tr>';
  });
  container.innerHTML='<table id="expense-table" style="min-width:680px;"><thead><tr>'
    +'<th>'+tt("Name")+'</th><th>'+tt("Category")+'</th><th style="text-align:right;">'+tt("Planned")+'</th><th style="text-align:right;">'+tt("Actual")+'</th><th></th><th style="text-align:right;">'+tt("Variance")+'</th><th style="width:38px;"></th>'
    +'</tr></thead><tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td colspan="2">'+tt("Total (KZT)")+'</td>'

function renderMonthInsights(){
  var k=openMonthKey;
  var container=document.getElementById("mo-insights");
  if(!container) return;
  var t=monthTotals(k);
  var m=ensureMonth(k);
  var recExp=recurringForMonth(k).filter(function(r){ return r.type==="expense"; });
  var list=[];

  if(isPast(k)&&!m.closed){
    list.push({type:"warn",text:tt("This month has passed \u2014 close it to bank the leftover into your net worth.")});
  }
  if(m.closed){
    list.push({type:"good",text:tt("Closed \u2014")+" "+fmt(m.leftover||0)+" "+tt("banked to net worth")+"."});
  }
  if(t.income===0&&(m.expenses.length||recExp.length)){
    list.push({type:"info",text:tt("No income logged yet \u2014 add it to see what is free to spend.")});
  }
  if(t.income>0&&t.planned>t.income){
    list.push({type:"warn",text:tt("The plan (incl. savings) exceeds income by")+" "+fmt(t.planned-t.income)+". "+tt("Something needs to shrink.")});
  }else if(t.income>0&&t.free>0&&!m.closed&&!isPast(k)){
    list.push({type:"good",text:fmt(t.free)+" "+tt("is unallocated \u2014 free to spend, or push it into a goal.")});
  }
  var overs=[];
  m.expenses.forEach(function(e){
    var dev=toKZT(e.actual,e.cur)-toKZT(e.planned,e.cur);
    if(dev>0&&e.planned>0) overs.push({name:e.name||e.category||"Unnamed",dev:dev});
  });
  recExp.forEach(function(r){
    var a=recEffectiveActual(k,m,r);
    var dev=toKZT(a,r.cur)-toKZT(r.amount,r.cur);
    if(dev>0) overs.push({name:r.name,dev:dev});
  });
  if(overs.length){
    overs.sort(function(a,b){ return b.dev-a.dev; });
    list.push({type:"warn",text:'\u201C'+overs[0].name+'\u201D '+tt("is over plan by")+" "+fmt(overs[0].dev)+"."});
  }
  state.goals.forEach(function(g){
    var need=goalNeededPerMonth(g);
    if(need==null||need<=0) return;
    var c=Number(g.contribs[k])||0;
    if(c<need&&t.free>0&&!isPast(k)){
      list.push({type:"info",text:'\u201C'+g.name+'\u201D '+tt("needs")+" "+fmt(need)+" "+tt("to stay on track \u2014")+" "+fmt(c)+" "+tt("contributed so far this month.")});
    }
  });
  if(recExp.length){
    var recTotal=recExp.reduce(function(s,r){ return s+toKZT(r.amount,r.cur); },0);
    list.push({type:"info",text:recExp.length+" "+(recExp.length===1?tt("recurring payment auto-included"):tt("recurring payments auto-included"))+": "+fmt(recTotal)+"/"+tt("mo")+"."});
  }
  if(!list.length) list.push({type:"info",text:tt("Add income and planned expenses to see insights.")});

  container.innerHTML=list.slice(0,6).map(function(i){
    var icon;
    if(i.type==="warn") icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>';
    else if(i.type==="good") icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
    else icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>';
    return '<div class="insight '+i.type+'">'+icon+'<div>'+esc(i.text)+'</div></div>';
  }).join("");
}

function openGoalModal(id){
  var existing=id?state.goals.find(function(g){ return g.id===id; }):null;
  var body=document.createElement("div");
  body.innerHTML=''
    +'<div class="field"><label>'+tt("Goal name")+'</label><input id="g-name" value="'+(existing?esc(existing.name):"")+'" placeholder="'+tt("Goal name")+'"></div>'
    +'<div class="field"><label>'+tt("Target amount (KZT)")+'</label><input id="g-target" class="mono" data-amt type="text" inputmode="decimal" value="'+(existing&&existing.target?fmtNum(existing.target):"")+'" placeholder="0.00"></div>'
    +'<div class="checkrow"><input type="checkbox" id="g-hasdl" '+(existing&&existing.deadline?"checked":"")+'><label for="g-hasdl" style="all:unset;cursor:pointer;font-size:13px;color:var(--dim);">'+tt("Has a deadline")+'</label></div>'
    +'<div id="g-dl-wrap" style="display:'+(existing&&existing.deadline?"block":"none")+';">'+monthYearSelects("deadline", existing&&existing.deadline?existing.deadline:null, 10)+'</div>';
  body.querySelector("#g-hasdl").addEventListener("change",function(e){
    body.querySelector("#g-dl-wrap").style.display=e.target.checked?"block":"none";
  });
  attachAmtFormat(body);
  openModal(existing?tt("Edit goal"):tt("New savings goal"), body, function(){
    var name=body.querySelector("#g-name").value.trim();
    var target=parseAmt(body.querySelector("#g-target").value);
    if(!name){ toast(tt("Name the goal")); return false; }
    if(!target||target<=0){ toast(tt("Enter a valid target")); return false; }
    var deadline=null;
    if(body.querySelector("#g-hasdl").checked){
      deadline=mk(parseInt(body.querySelector("#deadline-y").value,10),parseInt(body.querySelector("#deadline-m").value,10));
    }
    if(existing){ existing.name=name; existing.target=target; existing.deadline=deadline; }
    else state.goals.push({id:uid(),name:name,target:target,deadline:deadline,contribs:{}});
    save();
    if(view==="savings") renderSavings(document.getElementById("main"));
    else render();
    return true;
  });
}

function openContribModal(goalId){
  var g=state.goals.find(function(x){ return x.id===goalId; });
  if(!g) return;
  var body=document.createElement("div");
  body.innerHTML=''
    +'<div class="modal-note">'+tt("The contribution will appear in that month\u2019s expenses as")+' \u201C\u2192 '+esc(g.name)+'\u201D.</div>'
    +'<div class="field"><label>'+tt("Amount (KZT)")+'</label><input id="c-amt" class="mono" data-amt type="text" inputmode="decimal" placeholder="0.00"></div>'
    +monthYearSelects("month", nowKey(), 3);
  attachAmtFormat(body);
  openModal(tt("Add to")+' \u201C'+g.name+'\u201D', body, function(){
    var amt=parseAmt(body.querySelector("#c-amt").value);
    if(!amt){ toast(tt("Enter an amount")); return false; }
    var k=mk(parseInt(body.querySelector("#month-y").value,10),parseInt(body.querySelector("#month-m").value,10));
    g.contribs[k]=(Number(g.contribs[k])||0)+amt;

    save();
    if(view==="savings") renderSavings(document.getElementById("main"));
    else if(view==="month") refreshMonthEditor();
    else render();
    renderSidebar();
    return true;
  });

function monthYearSelects(prefix,value,yearsAhead){
  yearsAhead=yearsAhead||5;
  var y0=(new Date()).getFullYear();
  var years=[];
  for(var y=y0-3;y<=y0+yearsAhead;y++) years.push(y);
  var selY=value?keyYear(value):y0;
  var selM=value?keyMonth(value):((new Date()).getMonth()+1);
  if(years.indexOf(selY)===-1) years.push(selY);
  years.sort();
  var mopts=MONTH_FULL.map(function(name,i){ return '<option value="'+(i+1)+'" '+((i+1)===selM?"selected":"")+'>'+name+'</option>'; }).join("");
  var yopts=years.map(function(y2){ return '<option value="'+y2+'" '+(y2===selY?"selected":"")+'>'+y2+'</option>'; }).join("");
  return '<div class="field-row">'
    +'<div class="field"><label>'+tt(prefix+" month")+'</label><select id="'+prefix+'-m">'+mopts+'</select></div>'
    +'<div class="field"><label>'+tt(prefix+" year")+'</label><select id="'+prefix+'-y">'+yopts+'</select></div>'
    +'</div>';
}

    var cur=body.querySelector("#rec-cur").value;

    var start=mk(parseInt(body.querySelector("#start-y").value,10),parseInt(body.querySelector("#start-m").value,10));

    if(body.querySelector("#rec-hasend").checked){
      end=mk(parseInt(body.querySelector("#end-y").value,10),parseInt(body.querySelector("#end-m").value,10));
      if(end<start){ toast(tt("End date is before start date")); return false; }
    }
    if(existing){
      existing.name=name;existing.type=type;existing.category=category;
      existing.amount=amount;existing.cur=cur;existing.start=start;existing.end=end;
    }else{
      state.recurring.push({id:uid(),name:name,type:type,category:category,amount:amount,cur:cur,start:start,end:end});
    }

  });
}

function openGoalDetail(goalId){
  var g=state.goals.find(function(x){ return x.id===goalId; });
  if(!g) return;
  var overlay=document.createElement("div"); overlay.className="overlay";
  var modal=document.createElement("div"); modal.className="modal";
  overlay.appendChild(modal); document.body.appendChild(overlay);
  overlay.addEventListener("click",function(e){ if(e.target===overlay) overlay.remove(); });
  function irow(l,v){ return '<div class="gd-irow"><span>'+esc(l)+'</span><span class="mono">'+esc(v)+'</span></div>'; }
  function refreshOutside(){
    if(view==="savings") renderGoalsGrid();
    if(view==="month") refreshMonthEditor();
    renderSidebar();
  }
  function draw(){
    var saved=goalSaved(g);
    var pct=g.target>0?Math.min(100,Math.round(saved/g.target*100)):0;
    var need=goalNeededPerMonth(g);
    var keys=Object.keys(g.contribs).sort().reverse();
    var count=keys.length;
    var avg=count?saved/count:0;
    var remaining=Math.max(0,(Number(g.target)||0)-saved);
    var projTxt="\u2014";
    if(remaining<=0) projTxt=tt("Reached")+" \uD83C\uDF89";
    else if(avg>0){ projTxt="~"+labelShortKey(shiftKey(nowKey(),Math.ceil(remaining/avg)))+" "+tt("at current pace"); }
    modal.innerHTML='<h3>'+esc(g.name)+'</h3>'
      +'<div class="goal-track" style="margin-top:4px;"><div class="goal-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="goal-nums"><span>'+fmt(saved)+' / '+fmt(g.target)+'</span><span>'+pct+'%</span></div>'
      +'<div style="margin-top:14px;">'
      +irow(tt("Deadline"), g.deadline?labelShortKey(g.deadline)+" \u00B7 "+monthsBetween(nowKey(),g.deadline)+" "+tt("mo left"):tt("none"))
      +(need!=null?irow(tt("Needed monthly"),fmt(need)):"")
      +irow(tt("Contributions"),count+" "+(count===1?tt("month"):tt("months")))
      +(count?irow(tt("Average per month"),fmt(avg)):"")
      +irow(tt("Projected finish"),projTxt)
      +'</div>'
      +'<div class="section-title" style="margin:16px 0 6px;">'+tt("Contribution history")+'</div>'
      +(count
        ? keys.map(function(k){
            return '<div class="gd-row">'
              +'<div class="gd-month">'+esc(labelShortKey(k))+'</div>'
              +'<input class="cell-input mono in" data-edit-k="'+k+'" type="text" inputmode="decimal" value="'+fmtNum(g.contribs[k])+'">'
              +'<button class="icon-btn" data-del-k="'+k+'">'+trashIcon()+'</button>'
              +'</div>';
          }).join("")
        : '<div class="empty" style="padding:18px;">'+tt("No contributions yet.")+'</div>')
      +'<div class="modal-actions" style="justify-content:space-between;">'
      +'<button class="btn btn-secondary btn-small" id="gd-add">'+tt("+ Contribution")+'</button>'
      +'<button class="btn btn-primary btn-small" id="gd-close">'+tt("Close")+'</button></div>';

    modal.querySelector("#gd-close").onclick=function(){ overlay.remove(); };
    modal.querySelector("#gd-add").onclick=function(){ overlay.remove(); openContribModal(g.id); };
    modal.querySelectorAll("[data-edit-k]").forEach(function(inp){
      inp.addEventListener("change",function(){
        var k=inp.dataset.editK;
        var v=parseAmt(inp.value);
        if(v<=0) delete g.contribs[k]; else g.contribs[k]=v;
        save(); refreshOutside(); draw();
      });
    });
    modal.querySelectorAll("[data-del-k]").forEach(function(b){
      b.onclick=function(){
        delete g.contribs[b.dataset.delK];
        save(); refreshOutside(); draw();
      };
    });
  }
  draw();
}

  var d=document.getElementById("tour-dim"); if(d) d.remove();

function showTourStep(){
  clearTourUI();

  if(s.view==="month"){
    if(view!=="month"||openMonthKey!==nowKey()){ openMonthKey=nowKey(); ensureMonth(openMonthKey); view="month"; render(); }
  }else if(view!==s.view){ view=s.view; render(); }
  var isMobile = typeof window!=="undefined" && window.innerWidth && window.innerWidth<=860;
  // On mobile the sync action lives in the bottom-bar "More" sheet, not the sidebar.
  var sel = (s.sel==="#btn-sync" && isMobile) ? "#bn-more" : s.sel;

    var target = document.querySelector ? document.querySelector(sel) : null;

    document.body.appendChild(dim);
    if(target){
      if(target.classList) target.classList.add("tour-glow");

      // dim so the highlighted button reads brightly instead of being greyed out.
      var bnHost = target.closest ? target.closest("#bottom-nav") : null;
      if(bnHost && bnHost.style) bnHost.style.zIndex="2550";
      try{ target.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){ if(target.scrollIntoView) target.scrollIntoView(); }
    }
    var card=document.createElement("div"); card.id="tour-card"; card.className="tour-card";
    card.innerHTML='<div class="tour-step">'+tt("Step")+' '+(tourIndex+1)+' '+tt("of")+' '+TOUR.length+'</div>'

      +'<div style="display:flex;gap:8px;">'
      +(tourIndex>0?'<button class="btn btn-secondary btn-small" id="tour-back">'+tt("Back")+'</button>':'')

      +'</div></div>';
    document.body.appendChild(card);
    // Keep the card clear of what it points at: if the target sits low on screen
    // (e.g. the mobile bottom bar), flip the card to the top edge so it never covers it.
    if(target && target.getBoundingClientRect){
      var tr=target.getBoundingClientRect();
      var vh=(typeof window!=="undefined" && window.innerHeight) ? window.innerHeight : 800;
      if(tr.bottom > vh - 230){ card.style.top="20px"; card.style.bottom="auto"; }

    card.querySelector("#tour-next").onclick=function(){
      if(tourIndex===TOUR.length-1) endTour();
      else{ tourIndex++; showTourStep(); }
    };
  },90);
}

function sendFeedback(kind,msg,email){
  var payload={
    kind:kind, message:msg, email:email||null,
    lang:LANG, app_version:"v3",
    user_agent:(typeof navigator!=="undefined"?navigator.userAgent:""),
    user_id:(sbUser?sbUser.id:null)
  };
  var done=false;
  function ok(){ if(done) return; done=true; toast(tt("Thanks! Feedback sent.")); }
  function fail(){ if(done) return; done=true; toast(tt("Could not send \u2014 check your connection and try again.")); }

  var sentAnywhere=false;
  if(sb && sbUser){
    sentAnywhere=true;
    sb.from("feedback").insert(payload).then(function(res){
      if(res.error) fail(); else ok();
    }).catch(fail);
  }
  if(WEB3FORMS_KEY && typeof fetch==="function"){
    sentAnywhere=true;
    fetch("https://api.web3forms.com/submit",{
      method:"POST",
      headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({
        access_key:WEB3FORMS_KEY,
        subject:"Money Planner feedback: "+kind,
        from_name:"Money Planner",
        email:email||"noreply@planner.app",
        message:msg+"\n\n---\nkind: "+kind+"\nlang: "+LANG+"\nuser: "+(sbUser?sbUser.email:"anonymous")
      })
    }).then(function(r){ if(r.ok) ok(); else fail(); }).catch(fail);
  }
  if(!sentAnywhere) fail();
}

/* =============== CSV export =============== */

function exportCSV(){
  var allKeys={};
  Object.keys(state.months).forEach(function(k){ allKeys[k]=1; });
  var y=state.year;
  for(var m=1;m<=12;m++){ var k0=mk(y,m); if(recurringForMonth(k0).length||savedInMonth(k0)>0) allKeys[k0]=1; }
  state.goals.forEach(function(g){ Object.keys(g.contribs).forEach(function(k){ allKeys[k]=1; }); });
  var keys=Object.keys(allKeys).sort();
  if(!keys.length&&!state.assets.length){ toast(tt("Nothing to export yet")); return; }

  var rows=[["Month","Type","Name","Category","Currency","Planned","Actual","Amount KZT","Note"]];
  keys.forEach(function(k){
    var mo=state.months[k];
    recurringForMonth(k).forEach(function(r){
      if(r.type==="income"){ rows.push([labelFull(k),"Income",r.name,"Income",r.cur,"",r.amount,toKZT(r.amount,r.cur).toFixed(2),"recurring"]); return; }
      var eff=recEffectiveActual(k,mo,r);
      rows.push([labelFull(k),"Expense",r.name,r.category,r.cur,r.amount,eff,toKZT(eff,r.cur).toFixed(2),"recurring"]);
    });
    if(mo){
      mo.incomes.forEach(function(i){ rows.push([labelFull(k),"Income",i.name,"Income",i.cur,"",i.amount,toKZT(i.amount,i.cur).toFixed(2),""]); });
      mo.expenses.forEach(function(e){ rows.push([labelFull(k),"Expense",e.name||"",e.category||"Other",e.cur,e.planned,e.actual,toKZT(e.actual,e.cur).toFixed(2),""]); });
      if(mo.closed) rows.push([labelFull(k),"Closed","Leftover","Banked","KZT","",mo.leftover||0,Number(mo.leftover||0).toFixed(2),"banked to net worth"]);
    }
    state.goals.forEach(function(g){
      if(g.contribs[k]) rows.push([labelFull(k),"Savings",g.name,"Savings","KZT","",g.contribs[k],Number(g.contribs[k]).toFixed(2),"counted as expense"]);
    });
  });
  state.assets.forEach(function(a){
    rows.push(["\u2014",a.kind==="liability"?"Liability":"Asset",a.name,"Net worth",a.cur,"",a.value,((a.kind==="liability"?-1:1)*toKZT(a.value,a.cur)).toFixed(2),""]);
  });
  var csv=rows.map(function(r){
    return r.map(function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; }).join(",");
  }).join("\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="money-planner.csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(tt("CSV downloaded"));
}
