var EMBEDDED_SUPABASE_KEY="sb_publishable_HhYlVgXWtq7yQ3Cvz-vysQ_IUFM_xZF";
var syncCfg={url:EMBEDDED_SUPABASE_URL,anonKey:EMBEDDED_SUPABASE_KEY};
var sb=null, sbUser=null;
var syncState="off"; // off | ready | syncing | synced | error
var pushTimer=null, pushInFlight=false, pendingPush=false;
// A device must not push over the cloud until it has reconciled with it once (guards the
// startup race where a background save on open would otherwise clobber a newer cloud copy).
var syncReady=false;

function loadSyncCfg(){
  try{
    var r=localStorage.getItem(SYNC_CFG_KEY);
    if(r){ var p=JSON.parse(r); if(p&&p.url&&p.anonKey) syncCfg=p; }
  }catch(e){}
  if(!syncCfg.url||!syncCfg.anonKey) syncCfg={url:EMBEDDED_SUPABASE_URL,anonKey:EMBEDDED_SUPABASE_KEY};
}
function saveSyncCfg(){
  try{ localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(syncCfg)); }catch(e){}
}
function setSyncState(s){
  syncState=s;
  var d=document.getElementById("sync-dot");
  if(d) d.className="sync-dot "+s;
  var lbl=document.getElementById("sync-label");
  if(lbl) lbl.textContent = s==="synced"?tt("Synced"):(s==="syncing"?tt("Syncing\u2026"):(s==="error"?tt("Sync error"):(s==="ready"?tt("Sign in"):tt("Sync"))));
}
function initSupabase(){
  if(!syncCfg.url||!syncCfg.anonKey) return false;
  if(typeof window.supabase==="undefined"||!window.supabase.createClient) return false;
  try{
    sb=window.supabase.createClient(syncCfg.url,syncCfg.anonKey);
    authListenerSet=false;
    return true;
  }catch(e){ sb=null; return false; }
}
var gateMode="in";
var gateEmail="";
var appStarted=false;
var authListenerSet=false;

function storageKey(){ return sbUser ? STORAGE_KEY+"::"+sbUser.id : STORAGE_KEY; }

function resetStateVars(){
  state.year=(new Date()).getFullYear();
  state.rates={}; state.ratesUpdated=null; state.lastModified=null;
  state.months={}; state.recurring=[]; state.goals=[]; state.assets=[];
  state.tourDone=false;
}

function attachAuthListener(){
  if(authListenerSet||!sb) return;
  authListenerSet=true;
  sb.auth.onAuthStateChange(function(_evt,session){
    var was=!!sbUser;
    sbUser=session?session.user:null;
    if(sbUser){
      if(!appStarted) enterApp();
      else if(!was) pullRemote();
    }else if(appStarted||was){
      appStarted=false;
      setSyncState("ready");
      showGate("auth","");
    }
  });
}

function boot(){
  loadSyncCfg();
  if(!initSupabase()){ showGate("setup",""); return; }
  setSyncState("ready");
  attachAuthListener();
  sb.auth.getSession().then(function(res){
    sbUser = res && res.data && res.data.session ? res.data.session.user : null;
    if(sbUser){ if(!appStarted) enterApp(); }
    else showGate("auth","");
  }).catch(function(){ showGate("auth",tt("Could not connect \u2014 check your internet and reload.")); });
}

function enterApp(){
  if(appStarted) return;
  appStarted=true;
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="flex";
  resetStateVars();
  load();
  render();
  if(!storageOK) toast("Local caching unavailable in this browser mode \u2014 cloud sync still works");
  setSyncState("syncing");
  syncReady=false;   // block pushes until the initial pull has reconciled with the cloud
  // Refresh currency rates only AFTER reconciling \u2014 refreshing calls save(), and a save on open
  // must not bump the sync clock or push before we know whether the cloud copy is newer.
  pullRemote(function(){
    if(ratesStale()) refreshRates(function(ok){ if(ok){ toast(tt("Currency rates refreshed")); render(); } });
  });
}

function showGate(mode,msg){

  var g=document.getElementById("gate");

  if(mode==="setup") renderGateSetup(g,msg||"");
  else renderGateAuth(g,msg||"");
}

   +'<div class="field"><label>Project URL</label><input id="gs-url" value="'+esc(syncCfg.url||"")+'" placeholder="https://xxxx.supabase.co"></div>'

function meaningfulLocalData(){
  return Object.keys(state.months).length>0||state.recurring.length>0||state.goals.length>0||state.assets.length>0;
}
function canonical(o){
  if(Array.isArray(o)) return o.map(canonical);
  if(o&&typeof o==="object"){
    var out={};
    Object.keys(o).sort().forEach(function(k){ out[k]=canonical(o[k]); });
    return out;
  }
  return o;
}
function stateForCompare(o){
  var c=canonical(JSON.parse(JSON.stringify(o)));
  delete c.lastModified;
  return JSON.stringify(c);
}
function resetAndLoadFrom(p){
  try{ localStorage.setItem(storageKey(),JSON.stringify(p)); }catch(e){}
  state.months={}; state.recurring=[]; state.goals=[]; state.assets=[]; state.rates={};
  load();
  render();
}
function pullRemote(after){
  if(!sb||!sbUser){ if(after) after(); return; }
  setSyncState("syncing");
  sb.from("planner_data").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle()
  .then(function(res){
    // Reconciliation is happening now — from here this device is allowed to push again.
    syncReady=true;
    var fin=function(){ if(after) after(); maybeStartTour(); };
    if(res.error){ setSyncState("error"); toast("Sync error: "+res.error.message); if(pendingPush){ pendingPush=false; pushRemote(); } fin(); return; }
    var row=res.data;
    if(!row||!row.data){ pendingPush=false; pushRemote(); fin(); return; }   // empty cloud row — seed it from local
    var remote=row.data;
    if(stateForCompare(remote)===stateForCompare(state)){ setSyncState("synced"); if(pendingPush){ pendingPush=false; pushRemote(); } fin(); return; }
    if(!meaningfulLocalData()){
      resetAndLoadFrom(remote); setSyncState("synced"); pendingPush=false;   // nothing worth keeping locally — take the cloud
      toast(tt("Loaded your data from the cloud")); fin(); return;
    }
    var remoteT=Number(remote.lastModified)||(row.updated_at?new Date(row.updated_at).getTime():0);
    var localT=Number(state.lastModified)||0;
    if(remoteT>localT){
      resetAndLoadFrom(remote); setSyncState("synced"); pendingPush=false;   // cloud is newer — discard the stale local push
      toast(tt("Updated from cloud (newer copy)"));
    }else{
      pendingPush=false; pushRemote();                                       // local is same age or newer — this device wins
    }
    fin();
  }).catch(function(){ syncReady=true; setSyncState("error"); if(after) after(); maybeStartTour(); });
}
function pushRemote(){
  if(!sb||!sbUser) return;
  if(!syncReady){ pendingPush=true; return; }   // never overwrite the cloud before the first pull has reconciled
  if(pushInFlight){ pendingPush=true; return; }
  pushInFlight=true;
  setSyncState("syncing");
  sb.from("planner_data").upsert({user_id:sbUser.id,data:state,updated_at:new Date().toISOString()})
  .then(function(res){
    pushInFlight=false;
    if(res.error){ setSyncState("error"); toast("Sync push failed: "+res.error.message); }
    else setSyncState("synced");
    if(pendingPush){ pendingPush=false; pushRemote(); }
  }).catch(function(){ pushInFlight=false; setSyncState("error"); });
}
function schedulePush(){
  if(!sb||!sbUser) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushRemote,1500);
}

function openSyncModal(){

  overlay.appendChild(modal); document.body.appendChild(overlay);
  overlay.addEventListener("click",function(e){ if(e.target===overlay) overlay.remove(); });
  function close(){ overlay.remove(); }

  function drawSetup(msg){
    modal.innerHTML='<h3>Connect Supabase</h3>'
      +'<div class="modal-note">Paste your project credentials once \u2014 they are stored only on this device. Find them in Supabase Dashboard \u2192 Project Settings \u2192 API. Before first use, run the SQL from <b>supabase-setup.sql</b> in the SQL Editor (creates the planner_data table).</div>'
      +(msg?'<div class="modal-note" style="color:var(--pink);">'+esc(msg)+'</div>':'')
      +'<div class="field"><label>Project URL</label><input id="sy-url" value="'+esc(syncCfg.url||"")+'" placeholder="https://xxxx.supabase.co"></div>'
      +'<div class="field"><label>Anon public key</label><input id="sy-key" value="'+esc(syncCfg.anonKey||"")+'" placeholder="eyJ\u2026"></div>'
      +'<div class="modal-actions"><button class="btn btn-secondary btn-small" id="sy-cancel">Cancel</button>'
      +'<button class="btn btn-primary btn-small" id="sy-connect">Connect</button></div>';
    modal.querySelector("#sy-cancel").onclick=close;
    modal.querySelector("#sy-connect").onclick=function(){
      var url=modal.querySelector("#sy-url").value.trim();
      var key=modal.querySelector("#sy-key").value.trim();
      if(!url||!key){ toast("Both fields are required"); return; }
      syncCfg={url:url,anonKey:key};
      saveSyncCfg();
      if(typeof window.supabase==="undefined"){ drawSetup("Supabase library did not load \u2014 check the internet connection and reload the page."); return; }
      if(!initSupabase()){ drawSetup("Could not create a client from these credentials."); return; }
      setSyncState("ready");
      drawAuth("");
    };
  }

  function drawAuth(msg){
    var isOk = msg && msg.indexOf("\u2713")===0;
    modal.innerHTML='<h3>Sign in to sync</h3>'
      +'<div class="modal-note">One account = your data on every device. New here? Create the account, confirm the email Supabase sends you, then sign in.</div>'
      +(msg?'<div class="modal-note" style="color:'+(isOk?"var(--green)":"var(--pink)")+';">'+esc(msg)+'</div>':'')
      +'<div class="field"><label>Email</label><input id="sy-email" type="email" autocomplete="username" placeholder="you@example.com"></div>'
      +'<div class="field"><label>Password</label><input id="sy-pass" type="password" autocomplete="current-password" placeholder="min. 6 characters"></div>'
      +'<div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap;gap:10px;">'
      +'<button class="btn btn-secondary btn-small" id="sy-signup">Create account</button>'
      +'<div style="display:flex;gap:10px;"><button class="btn btn-secondary btn-small" id="sy-back">Back</button>'
      +'<button class="btn btn-primary btn-small" id="sy-signin">Sign in</button></div></div>';
    modal.querySelector("#sy-back").onclick=function(){ drawSetup(""); };
    modal.querySelector("#sy-signin").onclick=function(){
      var email=modal.querySelector("#sy-email").value.trim();
      var pass=modal.querySelector("#sy-pass").value;
      if(!email||!pass){ toast("Enter email and password"); return; }
      sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
        if(res.error){ drawAuth(res.error.message); return; }
        sbUser=res.data.user;
        close();
        toast("Signed in \u2014 syncing\u2026");
        pullRemote();
      }).catch(function(){ drawAuth("Network error \u2014 try again."); });
    };
    modal.querySelector("#sy-signup").onclick=function(){
      var email=modal.querySelector("#sy-email").value.trim();
      var pass=modal.querySelector("#sy-pass").value;
      if(!email||!pass){ toast("Enter email and password"); return; }
      if(pass.length<6){ toast("Password must be at least 6 characters"); return; }
      sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:window.location.origin}}).then(function(res){
        if(res.error){ drawAuth(res.error.message); return; }
        drawAuth("\u2713 Account created \u2014 confirm the email Supabase sent you, then sign in here.");
      }).catch(function(){ drawAuth("Network error \u2014 try again."); });
    };
  }

  function drawAccount(){
    modal.innerHTML='<h3>'+tt("Sync")+'</h3>'
      +'<div class="modal-note">'+tt("Signed in as")+' <b>'+esc(sbUser.email||"")+'</b><br>'+tt("Status")+': '+esc(tt(syncState==="synced"?"Synced":syncState))+'</div>'
      +'<div class="actions" style="margin:0 0 8px;">'
      +'<button class="btn btn-secondary btn-small" id="sy-exp">'+tt("Export backup (.json)")+'</button>'
      +'<button class="btn btn-secondary btn-small" id="sy-imp">'+tt("Import data")+'</button>'
      +'</div>'
      +'<div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap;gap:10px;">'
      +'<button class="btn btn-secondary btn-small" id="sy-signout">'+tt("Sign out")+'</button>'
      +'<div style="display:flex;gap:10px;"><button class="btn btn-secondary btn-small" id="sy-close">'+tt("Close")+'</button>'
      +'<button class="btn btn-primary btn-small" id="sy-now">'+tt("Sync now")+'</button></div></div>';
    modal.querySelector("#sy-close").onclick=close;
    modal.querySelector("#sy-now").onclick=function(){ pullRemote(); close(); };
    modal.querySelector("#sy-exp").onclick=function(){ exportJSON(); };
    modal.querySelector("#sy-imp").onclick=function(){ close(); openImportModal(); };
    modal.querySelector("#sy-signout").onclick=function(){
      sb.auth.signOut().then(function(){
        sbUser=null; setSyncState("ready"); close();
        toast(tt("Signed out \u2014 data stays on this device"));
      });
    };
  }

  if(!syncCfg.url||!syncCfg.anonKey||!sb) drawSetup("");
  else if(!sbUser) drawAuth("");
  else drawAccount();
}
